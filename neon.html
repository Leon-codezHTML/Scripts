<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .theme {
            color: rgb(0, 0, 15);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 200px;
            text-align: center;
            padding-top: 200px;
            animation: rainbow 10s infinite;
        }
        body {
            background: rgb(0, 0, 15);
        }
        @keyframes rainbow {
           0% {text-shadow: 0 0 100px red;}
           10% {text-shadow: 0 0 100px orangered;}
           20% {text-shadow: 0 0 100px orange;}
           30% {text-shadow: 0 0 100px yellow;}
           40% {text-shadow: 0 0 100px yellowgreen;}
           50% {text-shadow: 0 0 100px lightgreen;}
           60% {text-shadow: 0 0 100px green;}
           70%{text-shadow: 0 0 100px blue;}
           80%{text-shadow: 0 0 100px blueviolet;}
           90%{text-shadow: 0 0 100px violet;}
           100%{text-shadow: 0 0 100px pink;}
        }
    </style>
</head>
<body>
    <h1 class="theme">NEON</h1>
</body>
</html>
